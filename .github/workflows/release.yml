name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version already merged on the default branch, without the v prefix (e.g. 0.2.28)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Test release script
        run: node --test .github/scripts/release.test.js

      - name: Check the merged version and release notes
        env:
          VERSION: ${{ inputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node .github/scripts/release.js check-release

  build:
    needs: validate
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish GitHub release
    if: github.repository == 'koral--/gradle-pitest-plugin'
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Tag and create GitHub release
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node .github/scripts/release.js notes > "$RUNNER_TEMP/release-notes.md"
          git tag "v$VERSION" "$GITHUB_SHA"
          git push origin "v$VERSION"
          gh release create "v$VERSION" \
            --verify-tag --title "v$VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"

  publish:
    name: Publish to Gradle Plugin Portal and Maven Central
    if: github.repository == 'koral--/gradle-pitest-plugin'
    needs: release
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ inputs.version }}

      - uses: actions/setup-node@v7
        with:
          node-version: '26'

      - uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Publish to Gradle Plugin Portal
        env:
          VERSION: ${{ inputs.version }}
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: |
          if node .github/scripts/release.js is-published-portal; then
            echo "Version $VERSION is already published to Gradle Plugin Portal, skipping."
          else
            ./gradlew publishPlugins -x test -x funcTest -x funcTestAgp9 --stacktrace
          fi

      - name: Publish and release to Maven Central
        env:
          VERSION: ${{ inputs.version }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
        run: |
          if node .github/scripts/release.js is-published-central; then
            echo "Version $VERSION is already published to Maven Central, skipping."
          else
            if [ -n "${{ secrets.SIGNING_IN_MEMORY_KEY_ID }}" ]; then
              export ORG_GRADLE_PROJECT_signingInMemoryKeyId="${{ secrets.SIGNING_IN_MEMORY_KEY_ID }}"
            fi
            if [ -n "${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}" ]; then
              export ORG_GRADLE_PROJECT_signingInMemoryKeyPassword="${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}"
            fi
            ./gradlew publishAndReleaseToMavenCentral -x test -x funcTest -x funcTestAgp9 --stacktrace
          fi
