name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      # Validation only, setup-gradle is intentionally not used (its caching component has proprietary license terms)
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Build and test
        run: ./gradlew check funcTest funcTestAgp9 --continue --stacktrace
        shell: bash
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: reports-${{ matrix.os }}
          path: build/reports/
          retention-days: 7
          if-no-files-found: ignore
