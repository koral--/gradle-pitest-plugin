//Dummy task to check pitest-report compile only dependency version consistency with default runtime pitest.jar version
//Please note, this is a helper task to detect forbade old version, not "malicious" actions.

def validatePitestVersionProvider = tasks.register("validatePitestVersion") {
    def aggregatorVersion = project.ext.pitestAggregatorVersion
    def dummyOutputFile = layout.buildDirectory.file("dummyVersionValidationOutput.txt")

    inputs.files(sourceSets.main.groovy.sourceDirectories)
    inputs.property("pitestAggregatorVersion", aggregatorVersion)
    outputs.file(dummyOutputFile) //just to not be always up-to-date

    doLast {
        logger.info("Configured 'pitestAggregatorVersion': {}", aggregatorVersion)
        List<String> linesWithVersionConstant = []
        sourceSets.main.groovy.srcDirs.each { File groovyMainSrcDir ->
            groovyMainSrcDir.eachFileRecurse(groovy.io.FileType.FILES) { file ->
                if (file.name == "PitestPlugin.groovy") {
                    linesWithVersionConstant += file.text.readLines()
                        .findAll { it.contains("String DEFAULT_PITEST_VERSION =") }
                        .each { logger.info("Line with version constant: {}", it) }
                }
            }
        }
        int matchingSize = linesWithVersionConstant.findAll { it.contains("'$aggregatorVersion'") }.size()
        int totalSize = linesWithVersionConstant.size()
        if (totalSize != 1 || totalSize != matchingSize) {
            throw new GradleException("Pitest version validation failed (found $matchingSize matching occurrences of total $totalSize). " +
                "Ensure 'ext.pitestAggregatorVersion' ($aggregatorVersion) in build.gradle is equal to 'DEFAULT_PITEST_VERSION' in PitestPlugin. Found lines:\n" +
                "${linesWithVersionConstant.join('\n')}")
        }
        File output = dummyOutputFile.get().asFile
        output.parentFile.mkdirs()
        output.text = "Validated pitest version $aggregatorVersion\n"
    }
}
tasks.named("check") {
    dependsOn(validatePitestVersionProvider)
}
